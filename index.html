<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Stats Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 600px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #ffffff;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }
        pre {
            background-color: #000;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9rem;
            color: #00ff41; /* Terminal green */
            line-height: 1.4;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #888;
        }
        .error {
            color: #ff5555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPU Statistics</h1>
        <pre id="stats-content">Loading stats...</pre>
        <div id="status-msg" class="status">Connecting to server...</div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:3000/gpu/stat';
        const statsElement = document.getElementById('stats-content');
        const statusElement = document.getElementById('status-msg');

        async function fetchStats() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const text = await response.text();
                statsElement.textContent = text;
                statusElement.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
                statusElement.classList.remove('error');
            } catch (error) {
                statsElement.textContent = 'Failed to load statistics.';
                statusElement.textContent = `Error: ${error.message}`;
                statusElement.classList.add('error');
            }
        }

        // Initial fetch
        fetchStats();

        // Refresh every 5 seconds
        setInterval(fetchStats, 1000);
    </script>
</body>
</html>
